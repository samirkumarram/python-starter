[project]
name = "llm-document-extractor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Samir Kumar Ram", email = "samir.ram@saksoft.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openai>=3.45.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.4",
    "python-docs>=0.1.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "tenacity>=9.2.1",
]

[project.scripts]
llm-document-extractor = "llm_document_extractor:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
